name: Build HolosCalendar Android APK
on:
  workflow_dispatch:
    inputs:
      alternate_maven_central:
        description: Use alternate official Maven Central endpoint
        type: boolean
        default: false
  push:
    branches: [main, 'holoscalendar-*']
  pull_request:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and test
        env:
          ORG_GRADLE_PROJECT_useAlternateMavenCentral: ${{ inputs.alternate_maven_central == true && 'true' || 'false' }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolosCalendar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package full project
        run: git archive --format=zip --prefix=HolosCalendar/ --output=HolosCalendar-project.zip HEAD
      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: HolosCalendar-full-project
          path: HolosCalendar-project.zip
          if-no-files-found: error
          retention-days: 14
